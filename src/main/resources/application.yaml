server:
  port: 8888
  shutdown: "graceful"

management:
  endpoint:
    health:
      show-details: "never"
    prometheus:
      access: read_only
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, prometheus

springdoc:
  packagesToScan: uk.gov.moj.cp.controllers
  writer-with-order-by-keys: true

logging:
  level:
    uk.gov.moj.cp: ${LOGGING_LEVEL:INFO}

spring:
  application:
    name: stg-vsp-subscription

notifications:
  gov-notify-api-key: ${GOV_NOTIFY_API_KEY:stgtrackmycaseservicenonprod-791606ca-575a-44de-8a18-313fecf9669b-489e670e-4b38-4bc2-b958-bca60efdf6f0}
  user-logged-in-email-template-id: ${TMC_USER_LOGGED_IN_TEMPLATE_ID:421fedb5-a9c4-41da-a160-f01ce205d9d4}
  service-url: ${TMC_SERVICE_URL:https://track-my-case-dev.apps.live.cloud-platform.service.justice.gov.uk}
  target-email: ${TMC_TARGET_EMAIL:munish.jalota@justice.gov.uk}
